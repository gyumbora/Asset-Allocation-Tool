<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오 리밸런싱 도구</title>
<style>
  :root{
    --bg:#FAF8F3;
    --surface:#FFFFFF;
    --ink:#1E2A28;
    --ink-soft:#5B6661;
    --ink-faint:#8A9189;
    --line:#DDD6C7;
    --accent:#2F6F4F;
    --accent-soft:#E6EFE8;
    --danger:#B23A2E;
    --danger-soft:#F7E8E5;
    --warn:#9C6B17;
    --warn-soft:#FBF1DD;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    line-height:1.5;
    padding:32px 24px 80px;
  }
  .wrap{max-width:1640px;margin:0 auto;}
  .header-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  h1{
    font-family:Georgia,"Noto Serif KR",serif;
    font-weight:500;
    font-size:26px;
    margin:0;
    letter-spacing:0.2px;
  }
  .num{font-family:"SF Mono","Consolas","Menlo",monospace;font-variant-numeric:tabular-nums;}

  /* 계좌 탭 */
  .tabs{display:flex;align-items:flex-end;gap:2px;margin-bottom:0;flex-wrap:wrap;}
  .tab{
    position:relative;
    padding:10px 14px 9px;
    background:var(--surface);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    font-size:13px;
    color:var(--ink-soft);
    display:flex;align-items:center;gap:6px;
  }
  .tab.active{
    color:var(--ink);
    font-weight:500;
    box-shadow: inset 0 3px 0 var(--accent);
    z-index:1;
  }
  .tab-name-input{
    border:none;
    background:transparent;
    padding:0;
    font:inherit;
    color:inherit;
    cursor:text;
    width:7em;
  }
  .tab-name-input:focus{outline:none;border-bottom:1px solid var(--accent);}
  .tab .del{
    color:var(--ink-faint);
    font-size:13px;
    line-height:1;
    padding:2px;
  }
  .tab .del:hover{color:var(--danger);}
  .tab-add{
    padding:10px 14px 9px;
    background:transparent;
    border:1px dashed var(--line);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:13px;
  }
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:0 8px 8px 8px;
    padding:24px;
  }

  /* 요약 카드 */
  .summary-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:10px;
    margin-bottom:20px;
  }
  .card{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
  }
  .card .label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .card .value{font-size:18px;font-weight:500;}
  .card input[type=number]{
    width:100%;border:none;background:transparent;
    font-size:18px;font-weight:500;font-family:"SF Mono","Consolas",monospace;
    color:var(--ink);padding:0;
  }
  .card input[type=number]:focus{outline:none;border-bottom:1px solid var(--accent);}
  .pos{color:var(--accent);}
  .neg{color:var(--danger);}

  .banner{
    border-radius:var(--radius);
    padding:10px 14px;
    font-size:13px;
    margin-bottom:16px;
    border:1px solid transparent;
  }
  .banner.danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);}
  .banner.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn);}

  /* 테이블 */
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:1180px;}
  thead th{
    text-align:right;
    font-weight:500;
    font-size:11.5px;
    color:var(--ink-soft);
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:9px 6px;
    white-space:nowrap;
  }
  thead th:nth-child(1),thead th:nth-child(2),thead th:nth-child(3){text-align:left;}
  tbody td{
    padding:5px 6px;
    border-bottom:1px solid var(--line);
    text-align:right;
    white-space:nowrap;
  }
  tbody td:nth-child(1),tbody td:nth-child(2),tbody td:nth-child(3){text-align:left;}
  tbody tr:last-child td{border-bottom:none;}
  tfoot td{
    padding:10px 8px;
    font-weight:500;
    border-top:2px solid var(--line);
    text-align:right;
    background:var(--bg);
  }
  tfoot td:nth-child(1){text-align:left;}

  input[type=text], input[type=number]{
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 6px;
    font-size:13px;
    background:var(--surface);
    color:var(--ink);
    font-family:"SF Mono","Consolas",monospace;
  }
  input[type=text]{font-family:inherit;width:122px;}
  input.code{width:64px;}
  input.num-in{width:76px;text-align:right;}
  input.ratio-in{width:52px;text-align:right;}
  input:focus{outline:none;border-color:var(--accent);}

  .order-btns{display:flex;flex-direction:column;gap:1px;}
  .order-btns button{
    border:none;background:transparent;color:var(--ink-faint);
    cursor:pointer;font-size:11px;line-height:1;padding:1px 4px;
  }
  .order-btns button:hover{color:var(--accent);}
  .order-btns button:disabled{opacity:0.25;cursor:default;}

  .btn{
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:7px;
    padding:7px 14px;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.ghost{border-style:dashed;color:var(--ink-soft);}
  .row-del{color:var(--ink-faint);background:none;border:none;cursor:pointer;font-size:14px;}
  .row-del:hover{color:var(--danger);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap;gap:10px;}
  .toolbar .left{display:flex;gap:8px;flex-wrap:wrap;}
  .toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .saved-note{font-size:12px;color:var(--ink-faint);}
  #importFile{display:none;}
  .badge{font-size:11px;padding:2px 6px;border-radius:5px;}
  .badge.buy{background:var(--accent-soft);color:var(--accent);}
  .badge.sell{background:var(--danger-soft);color:var(--danger);}
  .badge.zero{background:var(--bg);color:var(--ink-faint);}
  .row-flash, .row-flash td, .row-flash input{
    font-weight:700;
    transition:font-weight 0.15s;
  }
  .row-flash{background:var(--accent-soft);}
  .row-executed{background:#ECEAE4;}
  .row-executed td{color:var(--ink-faint);}
  .row-executed input[type=text], .row-executed input[type=number]{color:var(--ink-faint);}
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <h1>포트폴리오 리밸런싱 도구</h1>
    <button class="btn" id="helpBtn">❓ 도움말</button>
  </div>

  <div id="connBanner"></div>
  <div class="tabs" id="tabs"><div style="padding:10px 14px;color:var(--ink-soft);font-size:13px;">불러오는 중...</div></div>
  <div class="panel" id="panelRoot">
    <div id="banners"></div>
    <div class="summary-grid" id="summary"></div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>정렬</th>
            <th>종목명</th>
            <th>코드</th>
            <th>평단가</th>
            <th>현재가</th>
            <th>수익률</th>
            <th>보유수</th>
            <th>목표비중%</th>
            <th>현재비중</th>
            <th>추가주문수</th>
            <th>주문금액</th>
            <th>예상평가액</th>
            <th>예상비중</th>
            <th>주문 체크</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="etfBody"></tbody>
        <tfoot id="etfFoot"></tfoot>
      </table>
    </div>

    <div class="toolbar">
      <div class="left">
        <button class="btn ghost" id="addEtfBtn">+ ETF 추가</button>
        <button class="btn" id="refreshPricesBtn">↻ 현재가 새로고침</button>
        <button class="btn" id="applyOrdersBtn">✓ 추가 주문 완료</button>
      </div>
      <div class="right">
        <span class="saved-note" id="savedNote"></span>
        <button class="btn" id="exportBtn">JSON 내보내기(백업)</button>
        <button class="btn" id="importBtn">JSON 가져오기(복원)</button>
        <input type="file" id="importFile" accept="application/json">
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var state = null;

  function uid(prefix){
    return prefix + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function mkEtf(name, code, avgPrice, currentPrice, qty, targetRatio){
    return {
      id: uid("etf"),
      name: name || "",
      code: code || "",
      avgPrice: avgPrice || 0,
      currentPrice: currentPrice || 0,
      qty: qty || 0,
      targetRatio: targetRatio || 0,
      orderExecuted: false
    };
  }

  // ===== 서버 통신 =====
  function cleanStateForSave(){
    return JSON.parse(JSON.stringify(state, function(key, value){
      if(key.charAt(0) === "_") return undefined;
      return value;
    }));
  }

  function loadStateFromServer(){
    return fetch("/api/state").then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  function tryLoad(retries){
    return loadStateFromServer().catch(function(err){
      if(retries > 0){
        return new Promise(function(resolve){ setTimeout(resolve, 700); }).then(function(){
          return tryLoad(retries - 1);
        });
      }
      throw err;
    });
  }

  var saveTimer = null;
  function saveState(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      var payload = cleanStateForSave();
      fetch("/api/state", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function(res){
        if(!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }).then(function(){
        hideConnectionBanner();
        var note = document.getElementById("savedNote");
        if(note) note.textContent = "서버에 저장됨 " + new Date().toLocaleTimeString("ko-KR");
      }).catch(function(){
        showConnectionBanner();
        var note2 = document.getElementById("savedNote");
        if(note2) note2.textContent = "저장 실패 (서버 연결 끊김)";
      });
    }, 300);
  }

  function showConnectionBanner(){
    var el = document.getElementById("connBanner");
    if(el) el.innerHTML = '<div class="banner danger">서버에 연결할 수 없습니다. server.py(또는 run_server.bat)가 실행 중인지 확인해주세요. 지금 입력한 내용은 저장되지 않고 있습니다.</div>';
  }
  function hideConnectionBanner(){
    var el = document.getElementById("connBanner");
    if(el) el.innerHTML = "";
  }

  function getActiveAccount(){
    var found = state.accounts.find(function(a){ return a.id === state.activeAccountId; });
    return found || state.accounts[0];
  }

  function fmtWon(n){
    n = Math.round(n || 0);
    return "₩" + n.toLocaleString("ko-KR");
  }
  function fmtPct(n){
    return (n*100).toFixed(2) + "%";
  }
  function fmtSignedWon(n){
    n = Math.round(n || 0);
    var sign = n > 0 ? "+" : "";
    return sign + n.toLocaleString("ko-KR");
  }

  function calcAccount(acc){
    var sumCurrentValue = 0, sumCost = 0;
    acc.etfs.forEach(function(e){
      e._currentValue = (e.currentPrice || 0) * (e.qty || 0);
      e._cost = (e.avgPrice || 0) * (e.qty || 0);
      e._returnRate = e.avgPrice > 0 ? (e.currentPrice / e.avgPrice - 1) : 0;
      sumCurrentValue += e._currentValue;
      sumCost += e._cost;
    });
    var totalAssets = (acc.cash || 0) + sumCurrentValue + (acc.additionalDeposit || 0);
    var sumExpectedValue = 0, netOrderAmount = 0, targetRatioSum = 0;
    acc.etfs.forEach(function(e){
      e._currentRatio = sumCurrentValue > 0 ? e._currentValue / sumCurrentValue : 0;
      var targetFrac = (e.targetRatio || 0) / 100;
      targetRatioSum += (e.targetRatio || 0);
      var orderQty = 0;
      if(e.currentPrice > 0){
        orderQty = Math.round(Math.floor(totalAssets * targetFrac / e.currentPrice) - (e.qty || 0));
      }
      e._orderQty = orderQty;
      e._orderAmount = orderQty * (e.currentPrice || 0);
      e._expectedValue = (e.currentPrice || 0) * ((e.qty || 0) + orderQty);
      e._expectedRatio = totalAssets > 0 ? e._expectedValue / totalAssets : 0;
      sumExpectedValue += e._expectedValue;
      netOrderAmount += e._orderAmount;
    });
    var availableCash = (acc.cash || 0) + (acc.additionalDeposit || 0);
    var expectedCashAfter = availableCash - netOrderAmount;
    var totalReturn = sumCost > 0 ? (sumCurrentValue / sumCost - 1) : 0;
    return {
      sumCurrentValue: sumCurrentValue, sumCost: sumCost, totalAssets: totalAssets,
      sumExpectedValue: sumExpectedValue, netOrderAmount: netOrderAmount,
      availableCash: availableCash, expectedCashAfter: expectedCashAfter,
      totalReturn: totalReturn, targetRatioSum: targetRatioSum
    };
  }

  function render(){
    renderTabs();
    var acc = getActiveAccount();
    var calc = calcAccount(acc);
    renderBanners(calc);
    renderSummary(acc, calc);
    renderTable(acc, calc);
  }

  function renderTabs(){
    var tabsEl = document.getElementById("tabs");
    var html = "";
    state.accounts.forEach(function(a){
      var active = a.id === state.activeAccountId ? " active" : "";
      html += '<div class="tab' + active + '" data-account-tab="' + a.id + '">' +
        '<input type="text" class="tab-name-input" data-account-rename="' + a.id + '" value="' + escapeAttr(a.name) + '" maxlength="6" placeholder="계좌 별칭">' +
        (state.accounts.length > 1 ? '<span class="del" data-account-del="' + a.id + '" title="계좌 삭제">×</span>' : '') +
        '</div>';
    });
    html += '<div class="tab-add" id="addAccountBtn">+ 계좌</div>';
    tabsEl.innerHTML = html;
  }

  function renderBanners(calc){
    var el = document.getElementById("banners");
    var html = "";
    if(Math.abs(calc.targetRatioSum - 100) > 0.01){
      html += '<div class="banner warn">목표비중 합계가 100%가 아닙니다 (현재 ' + calc.targetRatioSum.toFixed(1) + '%). 비중을 확인해주세요.</div>';
    }
    if(calc.expectedCashAfter < 0){
      html += '<div class="banner danger">현금이 부족합니다. 추가 주문을 모두 실행하려면 ' + fmtWon(-calc.expectedCashAfter) + ' 이 더 필요합니다.</div>';
    }
    el.innerHTML = html;
  }

  function renderSummary(acc, calc){
    var el = document.getElementById("summary");
    el.innerHTML =
      '<div class="card"><div class="label">현금 잔액</div>' +
        '<input type="number" class="num" id="cashInput" value="' + (acc.cash || 0) + '"></div>' +
      '<div class="card"><div class="label">추가 투자금액</div>' +
        '<input type="number" class="num" id="depositInput" value="' + (acc.additionalDeposit || 0) + '"></div>' +
      '<div class="card"><div class="label">현재 평가액 합계</div><div class="value num">' + fmtWon(calc.sumCurrentValue) + '</div></div>' +
      '<div class="card"><div class="label">총 자산</div><div class="value num">' + fmtWon(calc.totalAssets) + '</div></div>' +
      '<div class="card"><div class="label">전체 수익률</div><div class="value num ' + (calc.totalReturn >= 0 ? "pos" : "neg") + '">' + fmtPct(calc.totalReturn) + '</div></div>' +
      '<div class="card"><div class="label">순매수(+)/매도(-) 금액</div><div class="value num ' + (calc.netOrderAmount >= 0 ? "pos" : "neg") + '">' + fmtSignedWon(calc.netOrderAmount) + '</div></div>' +
      '<div class="card"><div class="label">리밸런싱 후 예상 현금</div><div class="value num ' + (calc.expectedCashAfter < 0 ? "neg" : "") + '">' + fmtWon(calc.expectedCashAfter) + '</div></div>';

    document.getElementById("cashInput").addEventListener("input", function(){
      acc.cash = Number(this.value) || 0;
      reRenderKeepFocus();
    });
    document.getElementById("depositInput").addEventListener("input", function(){
      acc.additionalDeposit = Number(this.value) || 0;
      reRenderKeepFocus();
    });
  }

  function renderTable(acc, calc){
    var body = document.getElementById("etfBody");
    var rows = "";
    acc.etfs.forEach(function(e, idx){
      var orderBadge;
      if(e._orderQty > 0){
        orderBadge = '<span class="badge buy">+' + e._orderQty + ' 매수</span>';
      } else if(e._orderQty < 0){
        orderBadge = '<span class="badge sell">' + e._orderQty + ' 매도</span>';
      } else {
        orderBadge = '<span class="badge zero">0</span>';
      }
      rows += '<tr data-etf-row="' + e.id + '" class="' + (e.orderExecuted ? "row-executed" : "") + '">' +
        '<td><div class="order-btns">' +
          '<button data-move-up="' + e.id + '" ' + (idx === 0 ? "disabled" : "") + '>▲</button>' +
          '<button data-move-down="' + e.id + '" ' + (idx === acc.etfs.length - 1 ? "disabled" : "") + '>▼</button>' +
        '</div></td>' +
        '<td><input type="text" data-field="name" data-id="' + e.id + '" value="' + escapeAttr(e.name) + '" placeholder="종목명"></td>' +
        '<td><input type="text" class="code" data-field="code" data-id="' + e.id + '" value="' + escapeAttr(e.code) + '" placeholder="코드"></td>' +
        '<td><input type="number" class="num-in" data-field="avgPrice" data-id="' + e.id + '" value="' + e.avgPrice + '"></td>' +
        '<td><input type="number" class="num-in" data-field="currentPrice" data-id="' + e.id + '" value="' + e.currentPrice + '"></td>' +
        '<td class="num ' + (e._returnRate >= 0 ? "pos" : "neg") + '">' + fmtPct(e._returnRate) + '</td>' +
        '<td><input type="number" class="num-in" data-field="qty" data-id="' + e.id + '" value="' + e.qty + '"></td>' +
        '<td><input type="number" class="ratio-in" data-field="targetRatio" data-id="' + e.id + '" value="' + e.targetRatio + '"></td>' +
        '<td class="num">' + fmtPct(e._currentRatio) + '</td>' +
        '<td class="num">' + orderBadge + '</td>' +
        '<td class="num ' + (e._orderAmount >= 0 ? "pos" : "neg") + '">' + fmtSignedWon(e._orderAmount) + '</td>' +
        '<td class="num">' + fmtWon(e._expectedValue) + '</td>' +
        '<td class="num">' + fmtPct(e._expectedRatio) + '</td>' +
        '<td style="text-align:center"><input type="checkbox" data-field="orderExecuted" data-id="' + e.id + '" title="증권사에서 주문을 실행했으면 체크" ' + (e.orderExecuted ? "checked" : "") + '></td>' +
        '<td><button class="row-del" data-del-etf="' + e.id + '" title="행 삭제">×</button></td>' +
      '</tr>';
    });
    body.innerHTML = rows;
    updateFooter(acc, calc);
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>]/g, function(c){
      return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;";
    });
  }
  function escapeAttr(s){
    return escapeHtml(s).replace(/"/g, "&quot;");
  }

  // 포커스를 잃지 않도록 요약 입력 변경 시에는 테이블/요약만 갱신
  function reRenderKeepFocus(){
    var acc = getActiveAccount();
    var calc = calcAccount(acc);
    renderBanners(calc);
    renderTable(acc, calc);
    saveState();
    refreshSummaryReadouts(calc);
  }

  function refreshSummaryReadouts(calc){
    var cards = document.querySelectorAll(".summary-grid .card");
    if(cards.length < 7) return;
    cards[2].querySelector(".value").textContent = fmtWon(calc.sumCurrentValue);
    cards[3].querySelector(".value").textContent = fmtWon(calc.totalAssets);
    var c4 = cards[4].querySelector(".value");
    c4.textContent = fmtPct(calc.totalReturn);
    c4.className = "value num " + (calc.totalReturn >= 0 ? "pos" : "neg");
    var c5 = cards[5].querySelector(".value");
    c5.textContent = fmtSignedWon(calc.netOrderAmount);
    c5.className = "value num " + (calc.netOrderAmount >= 0 ? "pos" : "neg");
    var c6 = cards[6].querySelector(".value");
    c6.textContent = fmtWon(calc.expectedCashAfter);
    c6.className = "value num " + (calc.expectedCashAfter < 0 ? "neg" : "");
  }

  function updateComputedCellsForRow(e){
    var row = document.querySelector('[data-etf-row="' + e.id + '"]');
    if(!row) return;
    var cells = row.querySelectorAll("td");
    cells[5].textContent = fmtPct(e._returnRate);
    cells[5].className = "num " + (e._returnRate >= 0 ? "pos" : "neg");
    cells[8].textContent = fmtPct(e._currentRatio);
    var orderBadge = e._orderQty > 0 ? '<span class="badge buy">+' + e._orderQty + ' 매수</span>'
      : e._orderQty < 0 ? '<span class="badge sell">' + e._orderQty + ' 매도</span>'
      : '<span class="badge zero">0</span>';
    cells[9].innerHTML = orderBadge;
    cells[10].textContent = fmtSignedWon(e._orderAmount);
    cells[10].className = "num " + (e._orderAmount >= 0 ? "pos" : "neg");
    cells[11].textContent = fmtWon(e._expectedValue);
    cells[12].textContent = fmtPct(e._expectedRatio);
  }

  function updateFooter(acc, calc){
    var foot = document.getElementById("etfFoot");
    foot.innerHTML = '<tr>' +
      '<td colspan="3">합계</td>' +
      '<td></td><td></td><td></td><td></td>' +
      '<td class="num">' + calc.targetRatioSum.toFixed(1) + '%</td>' +
      '<td class="num">100.00%</td>' +
      '<td></td>' +
      '<td class="num ' + (calc.netOrderAmount >= 0 ? "pos" : "neg") + '">' + fmtSignedWon(calc.netOrderAmount) + '</td>' +
      '<td class="num">' + fmtWon(calc.sumExpectedValue) + '</td>' +
      '<td class="num">' + (calc.totalAssets > 0 ? (calc.sumExpectedValue/calc.totalAssets*100).toFixed(2) : "0.00") + '%</td>' +
      '<td></td>' +
      '<td></td>' +
    '</tr>';
  }

  // ===== 이벤트 위임 =====
  document.getElementById("tabs").addEventListener("click", function(ev){
    var del = ev.target.closest("[data-account-del]");
    if(del){
      ev.stopPropagation();
      var delId = del.getAttribute("data-account-del");
      if(state.accounts.length <= 1) return;
      if(!window.confirm("이 계좌를 삭제하시겠습니까? 해당 계좌의 파일도 함께 삭제됩니다.")) return;
      state.accounts = state.accounts.filter(function(a){ return a.id !== delId; });
      if(state.activeAccountId === delId) state.activeAccountId = state.accounts[0].id;
      saveState(); render();
      return;
    }
    var addBtn = ev.target.id === "addAccountBtn";
    if(addBtn){
      var newAcc = { id: uid("acc"), name: "계좌 " + (state.accounts.length + 1), cash: 0, additionalDeposit: 0, etfs: [] };
      state.accounts.push(newAcc);
      state.activeAccountId = newAcc.id;
      saveState(); render();
      return;
    }
    var tab = ev.target.closest("[data-account-tab]");
    if(!tab) return;
    var newActiveId = tab.getAttribute("data-account-tab");
    var renameInput = ev.target.closest("[data-account-rename]");
    if(renameInput){
      if(state.activeAccountId !== newActiveId){
        state.activeAccountId = newActiveId;
        saveState(); render();
        var newInput = document.querySelector('[data-account-rename="' + newActiveId + '"]');
        if(newInput){ newInput.focus(); newInput.select(); }
      }
      return; // 같은 탭의 입력칸이면 그대로 두어 포커스/타이핑을 유지
    }
    if(state.activeAccountId !== newActiveId){
      state.activeAccountId = newActiveId;
      saveState(); render();
    }
  });

  document.getElementById("tabs").addEventListener("input", function(ev){
    var input = ev.target.closest("[data-account-rename]");
    if(!input) return;
    var id = input.getAttribute("data-account-rename");
    var acc = state.accounts.find(function(a){ return a.id === id; });
    if(!acc) return;
    acc.name = input.value;
    saveState();
  });

  document.getElementById("tabs").addEventListener("keydown", function(ev){
    if(ev.key === "Enter" && ev.target.matches && ev.target.matches("[data-account-rename]")){
      ev.target.blur();
    }
  });

  document.getElementById("tabs").addEventListener("focusout", function(ev){
    var input = ev.target.closest && ev.target.closest("[data-account-rename]");
    if(!input) return;
    var id = input.getAttribute("data-account-rename");
    var acc = state.accounts.find(function(a){ return a.id === id; });
    if(acc && !acc.name.trim()){
      acc.name = "계좌";
      input.value = acc.name;
      saveState();
    }
  });

  document.getElementById("etfBody").addEventListener("input", function(ev){
    var input = ev.target.closest("input[data-field]");
    if(!input) return;
    var acc = getActiveAccount();
    var etf = acc.etfs.find(function(e){ return e.id === input.getAttribute("data-id"); });
    if(!etf) return;
    var field = input.getAttribute("data-field");
    if(field === "orderExecuted"){
      etf.orderExecuted = input.checked;
      var row = input.closest("tr");
      if(row) row.classList.toggle("row-executed", etf.orderExecuted);
      saveState();
      return; // 계산값에는 영향이 없으므로 여기서 종료
    }
    if(field === "name" || field === "code"){
      etf[field] = input.value;
    } else {
      etf[field] = Number(input.value) || 0;
    }
    var calc = calcAccount(acc);
    renderBanners(calc);
    refreshSummaryReadouts(calc);
    saveState();
    updateComputedCellsForRow(etf);
    updateFooter(acc, calc);
  });

  document.getElementById("etfBody").addEventListener("click", function(ev){
    var del = ev.target.closest("[data-del-etf]");
    var up = ev.target.closest("[data-move-up]");
    var down = ev.target.closest("[data-move-down]");
    var acc = getActiveAccount();
    if(del){
      var id = del.getAttribute("data-del-etf");
      if(!window.confirm("이 ETF를 삭제하시겠습니까?")) return;
      acc.etfs = acc.etfs.filter(function(e){ return e.id !== id; });
      saveState(); render();
      return;
    }
    if(up || down){
      var targetId = up ? up.getAttribute("data-move-up") : down.getAttribute("data-move-down");
      var i = acc.etfs.findIndex(function(e){ return e.id === targetId; });
      var j = up ? i - 1 : i + 1;
      if(j < 0 || j >= acc.etfs.length) return;
      var tmp = acc.etfs[i]; acc.etfs[i] = acc.etfs[j]; acc.etfs[j] = tmp;
      saveState(); render();
    }
  });

  document.getElementById("addEtfBtn").addEventListener("click", function(){
    var acc = getActiveAccount();
    acc.etfs.push(mkEtf("", "", 0, 0, 0, 0));
    saveState(); render();
  });

  function fetchOnePrice(code){
    return fetch("/api/refresh-prices", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ codes: [code] })
    }).then(function(res){ return res.json(); })
      .then(function(data){
        if(!data.ok) return { ok: false, error: data.error || "알 수 없는 오류" };
        var r = data.results[code];
        if(!r) return { ok: false, error: "응답이 없습니다." };
        return r.ok ? { ok: true, name: r.name, price: r.price } : { ok: false, error: r.error };
      })
      .catch(function(){ return { ok: false, error: "서버에 연결할 수 없습니다." }; });
  }

  function flashRow(etfId){
    var row = document.querySelector('[data-etf-row="' + etfId + '"]');
    if(!row) return;
    row.classList.add("row-flash");
    setTimeout(function(){ row.classList.remove("row-flash"); }, 1000);
  }

  document.getElementById("refreshPricesBtn").addEventListener("click", async function(){
    var acc = getActiveAccount();
    var codes = [];
    acc.etfs.forEach(function(e){
      if(e.code && codes.indexOf(e.code) === -1) codes.push(e.code);
    });
    if(codes.length === 0){
      window.alert("코드가 입력된 종목이 없습니다.");
      return;
    }
    var btn = document.getElementById("refreshPricesBtn");
    var originalText = btn.textContent;
    btn.disabled = true;

    var failed = [];
    for(var i = 0; i < codes.length; i++){
      var code = codes[i];
      btn.textContent = "조회 중... (" + (i + 1) + "/" + codes.length + ")";

      var result = await fetchOnePrice(code); // 서버가 실패 시 내부적으로 재시도까지 마친 뒤의 최종 결과
      var matched = acc.etfs.filter(function(e){ return e.code === code; });

      if(result.ok){
        matched.forEach(function(e){
          e.name = result.name || e.name;
          e.currentPrice = result.price;
        });
        var calc = calcAccount(acc);
        renderBanners(calc);
        renderTable(acc, calc);
        refreshSummaryReadouts(calc);
        saveState();
        matched.forEach(function(e){ flashRow(e.id); });
      } else {
        var label = matched.length ? (matched[0].name || code) : code;
        failed.push(label + ": " + result.error);
      }

      // 한 항목씩 보여지는 느낌을 위해, 굵게 표시되는 동안 잠시 대기 후 다음 항목으로 진행
      await new Promise(function(resolve){ setTimeout(resolve, 1000); });
    }

    btn.disabled = false;
    btn.textContent = originalText;
    if(failed.length){
      window.alert("재시도에도 실패한 종목이 있습니다:\n" + failed.join("\n"));
    }
  });

  document.getElementById("applyOrdersBtn").addEventListener("click", function(){
    var acc = getActiveAccount();
    var calc = calcAccount(acc); // _orderQty, netOrderAmount, expectedCashAfter 등을 최신 값으로 갱신
    var hasAny = acc.etfs.some(function(e){ return (e._orderQty || 0) !== 0; });
    if(!hasAny){
      window.alert("반영할 추가주문이 없습니다.");
      return;
    }
    if(calc.expectedCashAfter < 0){
      window.alert(
        "현금이 부족해서 이 주문을 전부 체결할 수 없습니다.\n" +
        "부족한 금액: " + fmtWon(-calc.expectedCashAfter) + "\n\n" +
        "추가 투자금액을 늘리거나 목표비중을 조정한 뒤 다시 시도해주세요."
      );
      return;
    }
    if(!window.confirm(
      "현재 계산된 추가주문(매수/매도)을 현재가로 체결했다고 가정하고\n" +
      "보유수량·평단가·현금 잔액에 반영합니다.\n\n" +
      "매수/매도 금액의 차이가 현금 잔액에 반영되어, 적용 후 현금 잔액은 " + fmtWon(calc.expectedCashAfter) + " 이 됩니다.\n\n" +
      "되돌릴 수 없으니 필요하면 먼저 'JSON 내보내기'로 백업해두세요.\n\n계속하시겠습니까?"
    )) return;

    acc.etfs.forEach(function(e){
      var orderQty = e._orderQty || 0;
      if(orderQty === 0) return;
      var oldQty = e.qty || 0;
      var newQty = oldQty + orderQty;
      if(orderQty > 0){
        // 매수: 기존 보유분과 이번 매수분을 가중평균하여 평단가 재계산
        var newAvg = newQty > 0 ? (oldQty * e.avgPrice + orderQty * e.currentPrice) / newQty : 0;
        e.avgPrice = Math.round(newAvg);
      } else if(newQty <= 0){
        // 전부 매도된 경우 평단가는 의미가 없으므로 0으로 초기화
        e.avgPrice = 0;
      }
      // 매도(orderQty < 0)인데 일부만 남는 경우 평단가는 변하지 않음 (남은 보유분의 원가는 그대로)
      e.qty = Math.max(0, Math.round(newQty));
    });

    // 매수/매도 금액의 차이(남거나 모자란 돈)를 현금 잔액에 그대로 반영
    acc.cash = Math.round(calc.expectedCashAfter);
    // 이번 라운드에 반영하려던 추가 투자금액은 이미 현금에 합쳐졌으므로 초기화
    acc.additionalDeposit = 0;
    // 이번 라운드의 주문 체크 표시도 다음 라운드를 위해 모두 초기화
    acc.etfs.forEach(function(e){ e.orderExecuted = false; });

    saveState();
    render();
  });

  document.getElementById("exportBtn").addEventListener("click", function(){
    var clean = cleanStateForSave();
    clean.exportedAt = new Date().toISOString();
    var blob = new Blob([JSON.stringify(clean, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var d = new Date();
    var stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0") +
      "_" + String(d.getHours()).padStart(2,"0") + String(d.getMinutes()).padStart(2,"0") + String(d.getSeconds()).padStart(2,"0");
    a.href = url;
    a.download = "리밸런싱_백업_" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById("importBtn").addEventListener("click", function(){
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function(ev){
    var file = ev.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.accounts) || parsed.accounts.length === 0){
          window.alert("올바른 백업 파일이 아닙니다.");
          return;
        }
        if(!window.confirm("현재 데이터를 가져온 파일로 덮어쓰시겠습니까? (각 계좌 파일이 갱신됩니다)")) return;
        state = parsed;
        if(!state.accounts.find(function(a){ return a.id === state.activeAccountId; })){
          state.activeAccountId = state.accounts[0].id;
        }
        saveState(); render();
      }catch(e){
        window.alert("파일을 읽는 중 오류가 발생했습니다: " + e.message);
      }
      ev.target.value = "";
    };
    reader.readAsText(file);
  });

  document.getElementById("helpBtn").addEventListener("click", function(){
    window.open("/readme", "_blank");
  });

  function init(){
    tryLoad(3).then(function(loaded){
      state = loaded;
      render();
    }).catch(function(){
      document.getElementById("panelRoot").innerHTML =
        '<div class="banner danger">서버에 연결할 수 없습니다.<br>이 화면은 server.py와 함께 실행해야 합니다. run_server.bat(또는 server.py)을 실행한 뒤 이 페이지를 새로고침 해주세요.</div>';
    });
  }

  init();
})();
</script>
</body>
</html>
